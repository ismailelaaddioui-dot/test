name: Daily lead finder

# Runs once a day and appends new LinkedIn leads to your Google Sheet.
# You can also trigger it by hand from the Actions tab (workflow_dispatch).
on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC daily; adjust to taste
  workflow_dispatch:
    inputs:
      slice_size:
        description: "Queries to run this manual run"
        required: false
        default: "90"

jobs:
  find-leads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run lead finder
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CX: ${{ secrets.GOOGLE_CX }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python -m lead_finder \
            --slice-size "${{ github.event.inputs.slice_size || '90' }}" \
            --verbose
